# Reviews each pull request with the stock /code-review, and posts the findings as
# inline comments. Opus at the high level was picked by testing it on past PRs
# (research/code-review-evaluation.md, section 8.5).
name: Code review

# Runs when a PR is opened or gets a new commit. A push to a branch with no PR doesn't
# run it. Only PRs that change the app's code, settings, migrations, images, server
# files, or workflows are reviewed. Docs, plans, and tool config files aren't.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "web/**"
      - "migrations/**"
      - "ops/**"
      - "docker/**"
      - "compose.yaml"
      - "settings.json"
      - ".github/workflows/**"

permissions:
  contents: read

# A new commit cancels the review of the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts aren't reviewed. Neither are PRs from forks, which can't use the token.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      # The version round 1 tested. The review's recipe changes between versions.
      CLAUDE_CODE_VERSION: 2.1.301
      DISABLE_AUTOUPDATER: 1
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's own commit, not the merge with main, so the code matches the
          # lines the comments point to. Full history, so the reviewer can use git log.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - name: Install bubblewrap
        # The token scrub below runs each command in a bubblewrap sandbox. Ubuntu 24.04
        # blocks the namespaces bubblewrap needs, so allow them on this runner.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Review the PR
        # A timeout here fails only this step, so the transcript is still saved.
        timeout-minutes: 25
        # The token is the Max subscription (research doc section 4.2). The reviewer
        # gets read-only tools, plus gh to read the PR and post comments. The Edit and
        # Write tools and the web tools are blocked, and so is node, since the code under
        # review holds Google text that could carry instructions. The scrub keeps the
        # Claude token out of the commands the reviewer runs. sed, awk, and gh could
        # still write a file or call GitHub. That's accepted, since only this repo's own
        # PRs are reviewed, and a PR can change this workflow anyway.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          claude -p --model claude-opus-5-5 --output-format json \
            --allowedTools "Bash(git:*)" "Bash(gh:*)" "Bash(cd:*)" "Bash(cat:*)" "Bash(ls:*)" "Bash(grep:*)" "Bash(rg:*)" "Bash(find:*)" "Bash(head:*)" "Bash(tail:*)" "Bash(wc:*)" "Bash(sed:*)" "Bash(awk:*)" "Bash(sort:*)" Read Grep Glob \
            --disallowedTools Edit Write NotebookEdit WebFetch WebSearch "Bash(node:*)" \
            -- "/code-review high --comment $PR_NUMBER" > "$RUNNER_TEMP/review.json"
          jq -r '.result' "$RUNNER_TEMP/review.json" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"\nCost at API prices: $\(.total_cost_usd)"' "$RUNNER_TEMP/review.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the transcript
        # Shows what the reviewer read, such as whether it opened the PR's comments.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          # A rerun of the job is a new attempt, with its own artifact.
          name: review-transcript-${{ github.run_attempt }}
          path: |
            ~/.claude/projects/
            ${{ runner.temp }}/review.json
          include-hidden-files: true
          retention-days: 30
