# Reviews each pull request with the stock /code-review, and posts the findings as
# inline comments. Opus at the high level was picked by testing it on past PRs
# (research/code-review-evaluation.md, section 8.5).
name: Code review

# Runs when a PR is opened or gets a new commit. A push to a branch with no PR doesn't
# run it. Only PRs that change the app or how it's built and deployed are reviewed.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "web/**"
      - "migrations/**"
      - "ops/**"
      - "docker/**"
      - "compose.yaml"
      - ".github/workflows/**"

permissions:
  contents: read

# A new commit cancels the review of the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts aren't reviewed. Neither are PRs from forks, which can't use the token.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      # The version round 1 tested. The review's recipe changes between versions.
      CLAUDE_CODE_VERSION: 2.1.301
      DISABLE_AUTOUPDATER: 1
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's own commit, not the merge with main, so the code matches the
          # lines the comments point to. Full history, so the reviewer can use git log.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Review the PR
        # The token is the Max subscription (research doc section 4.2). The reviewer
        # can read the repo and use gh to read the PR and post comments. It can't edit
        # files or reach the web.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          claude -p --model claude-opus-5-5 --output-format json \
            --allowedTools "Bash(git:*)" "Bash(gh:*)" "Bash(cd:*)" "Bash(cat:*)" "Bash(ls:*)" "Bash(grep:*)" "Bash(rg:*)" "Bash(find:*)" "Bash(head:*)" "Bash(tail:*)" "Bash(wc:*)" "Bash(sed:*)" "Bash(awk:*)" "Bash(sort:*)" "Bash(node:*)" Read Grep Glob \
            --disallowedTools Edit Write NotebookEdit WebFetch WebSearch \
            -- "/code-review high --comment $PR_NUMBER" > review.json
          jq -r '.result' review.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '"\nCost at API prices: $\(.total_cost_usd)"' review.json >> "$GITHUB_STEP_SUMMARY"

      - name: Save the transcript
        # Shows what the reviewer read, such as whether it opened the PR's comments.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: review-transcript
          path: |
            ~/.claude/projects/
            review.json
          include-hidden-files: true
          retention-days: 30
