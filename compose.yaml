# The same file runs on the server and locally (systems design section 6).
# Locally, `docker compose up -d postgres` starts only the database for `npm run dev`.
name: road-trip-agent

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      # Postgres 18 keeps its data under this path, in a folder for each major version.
      - postgres-data:/var/lib/postgresql
    ports:
      # The host only: npm run dev and SSH tunnels reach it, the internet doesn't.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    # On the server, the deploy pulls this image and tags it :latest (ops/deploy.sh).
    # Locally, Compose builds it from the Dockerfile.
    image: ghcr.io/nimbusscale/road-trip-agent-app:latest
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      # Inside its container, the app listens on every address. No port is published,
      # so only the other containers can reach it.
      APP_HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      SUPABASE_URL: ${SUPABASE_URL:?}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Pulled or built the same way as app.
    image: ghcr.io/nimbusscale/road-trip-agent-web:latest
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      # Only for a local build. On the server, the image comes from the workflow, so
      # these can be missing from its .env.
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_GOOGLE_MAPS_BROWSER_KEY: ${VITE_GOOGLE_MAPS_BROWSER_KEY:-}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Caddy's certificates. Kept, so a restart doesn't ask for new ones.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

  backup:
    # The nightly backup (systems design section 9). It only starts on the server, where
    # .env sets COMPOSE_PROFILES=production. Pulled or built the same way as app.
    profiles: ["production"]
    image: ghcr.io/nimbusscale/road-trip-agent-backup:latest
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    # The Spaces keys may be empty, so a checkout without them can still run the rest.
    # backup-now stops with an error if they're missing.
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      RCLONE_CONFIG_SPACES_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_SPACES_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY:-}
    # The Postgres image declares a volume here for its data. Without this, Docker would
    # make an empty volume for it that docker compose down leaves behind.
    tmpfs:
      - /var/lib/postgresql
    depends_on:
      postgres:
        condition: service_healthy
    # A small init process runs the script, so docker compose down stops it at once,
    # even while it waits for 09:00.
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
